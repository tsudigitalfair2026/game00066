<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>スペースシャトルシューティングDX</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:sans-serif;
touch-action:none;
user-select:none;
}

.screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
background:linear-gradient(#020617,#000);
color:#fff;
}

.hidden{
display:none!important;
}

h1{
font-size:clamp(30px,8vw,48px);
margin-bottom:15px;
}

.desc{
line-height:1.8;
max-width:500px;
}

button{
margin-top:20px;
padding:18px 30px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:16px;
background:#22c55e;
color:white;
min-width:220px;
}

#gameScreen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
background:#000;
}

#hud{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
background:#07111f;
color:#fff;
font-weight:bold;
font-size:14px;
flex-shrink:0;
}

#gameCanvas{
width:100%;
height:calc(100vh - 60px);
display:block;
background:#000;
}

.rank{
font-size:48px;
color:gold;
font-weight:bold;
margin-top:15px;
}

#finalScore{
font-size:30px;
margin-top:15px;
}
</style>
</head>
<body>

<div id="startScreen" class="screen">
<h1>🚀 スペースシャトルシューティングDX</h1>

<div class="desc">
ドラッグでスペースシャトルを操作！<br>
敵👾と隕石☄️を撃破しよう！<br>
⭐パワースターでショット強化！<br>
🌈無敵スターで5秒間無敵！<br>
30秒生き残ればクリア！
</div>

<button id="startBtn">ゲームスタート</button>
</div>

<div id="gameScreen" class="hidden">

<div id="hud">
<div>スコア <span id="score">0</span></div>
<div>残り <span id="time">30</span>秒</div>
<div>❤ <span id="life">10</span></div>
<div>無敵 <span id="invincible">0</span></div>
</div>

<canvas id="gameCanvas"></canvas>

</div>

<div id="resultScreen" class="screen hidden">

<h1>結果発表</h1>

<div id="finalScore"></div>

<div id="rank" class="rank"></div>

<button id="retryBtn">もう一度遊ぶ</button>

</div>

<script>

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const lifeEl=document.getElementById("life");
const invincibleEl=document.getElementById("invincible");

let w,h;

let player;
let bullets=[];
let enemies=[];
let stars=[];
let powerups=[];
let invincibleStars=[];

let score=0;
let life=10;
let timeLeft=30;
let powerLevel=1;

let running=false;
let dragging=false;

let frame=0;
let invincibleTimer=0;

let timerInterval;

function resize(){

canvas.width=canvas.offsetWidth;
canvas.height=canvas.offsetHeight;

w=canvas.width;
h=canvas.height;

}

window.addEventListener("resize",resize);

function createStars(){

stars=[];

for(let i=0;i<100;i++){

stars.push({
x:Math.random()*w,
y:Math.random()*h,
s:1+Math.random()*3
});

}

}

function init(){

resize();

score=0;
life=10;
timeLeft=30;
powerLevel=1;
invincibleTimer=0;

bullets=[];
enemies=[];
powerups=[];
invincibleStars=[];

player={
x:w/2,
y:h-100,
r:22
};

createStars();

scoreEl.textContent=score;
timeEl.textContent=timeLeft;
lifeEl.textContent=life;
invincibleEl.textContent=0;

running=true;
frame=0;

clearInterval(timerInterval);

timerInterval=setInterval(()=>{

timeLeft--;

timeEl.textContent=timeLeft;

if(invincibleTimer>0){

invincibleTimer--;

invincibleEl.textContent=invincibleTimer;

}

if(timeLeft<=0){

endGame(true);

}

},1000);

requestAnimationFrame(loop);

}

function shoot(){

bullets.push({
x:player.x,
y:player.y-20
});

if(powerLevel>=2){

bullets.push({
x:player.x-12,
y:player.y-15
});

bullets.push({
x:player.x+12,
y:player.y-15
});

}

if(powerLevel>=3){

bullets.push({
x:player.x-24,
y:player.y-10
});

bullets.push({
x:player.x+24,
y:player.y-10
});

}

}

function spawnEnemy(){

enemies.push({

x:40+Math.random()*(w-80),
y:-40,
r:20,
speed:2+Math.random()*3+(30-timeLeft)*0.08,
type:Math.random()<0.5?"👾":"☄️"

});

}

function spawnPower(){

powerups.push({

x:40+Math.random()*(w-80),
y:-30,
r:18,
speed:2

});

}

function spawnInvincibleStar(){

invincibleStars.push({

x:40+Math.random()*(w-80),
y:-30,
r:18,
speed:2

});

}

function hit(a,b){

const dx=a.x-b.x;
const dy=a.y-b.y;

return Math.hypot(dx,dy)<a.r+b.r;

}

function update(){

frame++;

if(frame%8===0){
shoot();
}

if(frame%18===0){
spawnEnemy();
}

if(frame%350===0){
spawnPower();
}

if(frame%500===0){
spawnInvincibleStar();
}

for(let s of stars){

s.y+=s.s;

if(s.y>h){

s.y=0;
s.x=Math.random()*w;

}

}

for(let i=bullets.length-1;i>=0;i--){

bullets[i].y-=12;

if(bullets[i].y<-20){

bullets.splice(i,1);

}

}

for(let i=powerups.length-1;i>=0;i--){

const p=powerups[i];

p.y+=p.speed;

if(hit(player,p)){

powerLevel=Math.min(3,powerLevel+1);
score+=20;

scoreEl.textContent=score;

powerups.splice(i,1);
continue;

}

if(p.y>h+30){

powerups.splice(i,1);

}

}

for(let i=invincibleStars.length-1;i>=0;i--){

const s=invincibleStars[i];

s.y+=s.speed;

if(hit(player,s)){

invincibleTimer=5;

invincibleEl.textContent=5;

score+=30;
scoreEl.textContent=score;

invincibleStars.splice(i,1);

continue;

}

if(s.y>h+30){

invincibleStars.splice(i,1);

}

}

for(let i=enemies.length-1;i>=0;i--){

const e=enemies[i];

e.y+=e.speed;

let removed=false;

for(let j=bullets.length-1;j>=0;j--){

const b={
x:bullets[j].x,
y:bullets[j].y,
r:6
};

if(hit(e,b)){

score+=e.type==="👾"?10:6;

scoreEl.textContent=score;

bullets.splice(j,1);
enemies.splice(i,1);

removed=true;

break;

}

}

if(removed) continue;

if(hit(player,e)){

enemies.splice(i,1);

if(invincibleTimer<=0){

life--;

lifeEl.textContent=life;

if(life<=0){

endGame(false);
return;

}

}

continue;

}

if(e.y>h+60){

enemies.splice(i,1);

}

}

}

function draw(){

ctx.clearRect(0,0,w,h);

for(let s of stars){

ctx.fillStyle="white";
ctx.fillRect(s.x,s.y,s.s,s.s);

}

ctx.font="30px sans-serif";

for(let p of powerups){

ctx.fillText("⭐",p.x-15,p.y+10);

}

for(let s of invincibleStars){

ctx.fillText("🌈",s.x-15,s.y+10);

}

ctx.fillStyle="#5cc8ff";

for(let b of bullets){

ctx.fillRect(b.x-3,b.y-14,6,18);

}

for(let e of enemies){

ctx.font="40px sans-serif";
ctx.fillText(e.type,e.x-18,e.y+15);

}

ctx.save();

if(invincibleTimer>0){

ctx.shadowColor="yellow";
ctx.shadowBlur=30;
ctx.globalAlpha=0.9;
ctx.font="60px sans-serif";
ctx.fillText("🛸",player.x-30,player.y+20);

}else{

ctx.font="60px sans-serif";
ctx.fillText("🚀",player.x-30,player.y+20);

}

ctx.restore();

}

function loop(){

if(!running) return;

update();
draw();

requestAnimationFrame(loop);

}

function endGame(clear){

running=false;

clearInterval(timerInterval);

gameScreen.classList.add("hidden");
resultScreen.classList.remove("hidden");

document.getElementById("finalScore").textContent=
"最終スコア : "+score;

let rank="D";

if(score>=300) rank="S";
else if(score>=200) rank="A";
else if(score>=120) rank="B";
else if(score>=60) rank="C";

document.getElementById("rank").textContent=
(clear ? "クリア "+rank : "ゲームオーバー "+rank);

}

function movePlayer(x,y){

const rect=canvas.getBoundingClientRect();

player.x=Math.max(
30,
Math.min(w-30,x-rect.left)
);

player.y=Math.max(
60,
Math.min(h-30,y-rect.top)
);

}

canvas.addEventListener("pointerdown",(e)=>{

dragging=true;

if(player){
movePlayer(e.clientX,e.clientY);
}

});

canvas.addEventListener("pointermove",(e)=>{

if(dragging && player){

movePlayer(e.clientX,e.clientY);

}

});

canvas.addEventListener("pointerup",()=>{

dragging=false;

});

canvas.addEventListener("pointercancel",()=>{

dragging=false;

});

document.getElementById("startBtn").onclick=()=>{

startScreen.classList.add("hidden");
gameScreen.classList.remove("hidden");

init();

};

document.getElementById("retryBtn").onclick=()=>{

resultScreen.classList.add("hidden");
gameScreen.classList.remove("hidden");

init();

};

</script>
</body>
</html>
